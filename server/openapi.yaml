# N-Ways Addressing for Côte d'Ivoire: the registry API (OpenAPI 3.1).
# docs/api.md shows every endpoint with a real request and response.
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Côte d'Ivoire: registry API"
  version: "1.0.0"
  description: "The published registry of N-Ways codes for Côte d'Ivoire, served by server/ of https://github.com/n-ways/open-addresses-cote-divoire. Every response is JSON; every error is {\"error\": {\"code\", \"message\"}}. Examples are real responses from a server holding the full registry (long lists cut to their first two items). Issuing and changing codes is for the one deployment designated as the issuer."
  license:
    name: "Apache-2.0 (code); data ODbL-1.0"
    identifier: "Apache-2.0"
  contact:
    name: "N-WAYS LIMITED"
    url: "https://nways.ng"
    email: "hello@nways.ng"
servers:
  - url: "http://localhost:8080"
    description: "a local deployment"
paths:
  "/v1/health":
    get:
      summary: "Health"
      operationId: "health"
      responses:
        "200":
          description: "up"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              examples:
                health:
                  value:
                    status: "ok"
                    country: "CI"
                    codes: 7956622
                    registryExported: "2026-10-20T14:50:41Z"
                    issuing: true
  "/v1/info":
    get:
      summary: "Country, counts, licences, credit"
      operationId: "info"
      responses:
        "200":
          description: "information"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Info"
              examples:
                info:
                  value:
                    country: "CI"
                    name: "Côte d'Ivoire"
                    zones: 520
                    areas: 9834
                    names: 8618
                    codes:
                      total: 7956622
                      byStatus:
                        provisional: 7956622
                      byIssue:
                        bulk: 7956622
                    registryExported: "2026-10-20T14:50:41Z"
                    imported: "2026-10-21T14:14:25Z"
                    changedHere: null
                    engine: "internal/addressing/ci (SPEC v1.0)"
                    spec: "engine/SPEC.md"
                    licences:
                      data: "ODbL 1.0 (LICENSE-DATA)"
                      code: "Apache-2.0 (LICENSE, NOTICE)"
                      documents: "CC BY 4.0 (LICENSE-DOCS)"
                    credit: "N-Ways Addressing for Côte d'Ivoire, © N-WAYS LIMITED (nways.ng)"
                    creditUrl: "https://github.com/n-ways/open-addresses-cote-divoire"
                    issuing:
                      enabled: true
                      perKeyPerDay: 5
                    forms:
                      remembered: "Bonoumin · 61 36"
                      written: "Bonoumin 61 36 (Cocody)"
                      machine: "CI-010114-083-6136-2"
  "/v1/codes/{machine}":
    get:
      summary: "The full card of a code"
      operationId: "getCode"
      parameters:
        - name: "machine"
          in: "path"
          required: true
          description: "machine form, e.g. CI-010114-083-6136-2"
          schema:
            type: "string"
      responses:
        "200":
          description: "the card"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Card"
              examples:
                code:
                  value:
                    machine: "CI-010114-083-6136-2"
                    home: "Bonoumin 6136"
                    remembered: "Bonoumin · 61 36"
                    written: "Bonoumin 61 36 (Cocody)"
