components:
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              description: "stable code for programs"
            message:
              type: "string"
              description: "a sentence for people"
            existing:
              "$ref": "#/components/schemas/Card"
              description: "409 already_has_code: the code the point already has"
            point:
              "$ref": "#/components/schemas/Point"
          required:
            - "code"
            - "message"
      required:
        - "error"
    Point:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
      required:
        - "lat"
        - "lng"
    Zone:
      type: "object"
      properties:
        key:
          type: "string"
          pattern: "^[0-9]{6}$"
        name:
          type: "string"
        kind:
          type: "string"
          enum:
            - "sous-prefecture"
            - "commune-abidjan"
        departement:
          type: "string"
        region:
          type: "string"
      required:
        - "key"
        - "name"
    AreaBrief:
      type: "object"
      properties:
        id:
          type: "string"
          pattern: "^[0-9]{6}-[0-9]{3}$"
        plateName:
          type: "string"
        officialName:
          type: "string"
        nameKey:
          type: "string"
        nameId:
          type: "integer"
        provisionalName:
          type: "boolean"
          description: "the commune has still to choose the short name"
      required:
        - "id"
        - "plateName"
    Block:
      type: "object"
      properties:
        lo:
          type: "integer"
        hi:
          type: "integer"
        tailReserveFrom:
          type: "integer"
    Area:
      allOf:
        - "$ref": "#/components/schemas/AreaBrief"
        - type: "object"
          properties:
            zone:
              "$ref": "#/components/schemas/Zone"
            index:
              type: "string"
            digits:
              type: "integer"
              enum:
                - 4
                - 5
            blocks:
              type: "array"
              items:
                "$ref": "#/components/schemas/Block"
            place:
              "$ref": "#/components/schemas/Point"
            frame:
              type: "object"
              properties:
                west:
                  type: "number"
                south:
                  type: "number"
                east:
                  type: "number"
                north:
                  type: "number"
            codes:
              description: "in a zone listing: the number of codes; in GET /v1/areas/{id}: counts by status"
              oneOf:
                - type: "integer"
                - type: "object"
                  properties:
                    total:
                      type: "integer"
                    provisional:
                      type: "integer"
                    confirmed:
                      type: "integer"
                    retired:
                      type: "integer"
                    lowest:
                      type:
                        - "integer"
                        - "null"
                    highest:
                      type:
                        - "integer"
                        - "null"
            sameName:
              type: "array"
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                  zone:
                    "$ref": "#/components/schemas/Zone"
                  blocks:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Block"
            matchedBy:
              type: "string"
              enum:
                - "plate"
                - "alias"
                - "official"
    RegistryRow:
      type: "object"
      properties:
        machine:
          type: "string"
        home:
          type: "string"
        remembered:
          type: "string"
        written:
          type: "string"
        zone:
          type: "string"
        official_name:
          type: "string"
        number:
          type: "string"
        check:
          type: "string"
        status:
          type: "string"
        issued:
          type: "string"
        issued_at:
          type: "string"
        entrance_lat:
          type: "string"
        entrance_lng:
          type: "string"
        entrance_kind:
          type: "string"
        plus_code:
          type: "string"
        official_address:
          type: "string"
        class:
          type: "string"
        use:
          type: "string"
        kind:
          type: "string"
        structures:
          type: "string"
        floor_area_m2:
          type: "string"
        rule:
          type: "string"
        estate:
          type: "string"
      description: "the registry row exactly as published (every value a string, as in the CSV)"
    Card:
      type: "object"
      properties:
        machine:
          type: "string"
          pattern: "^CI-[0-9]{6}-[0-9]{3}-[0-9]{4,5}-[0-9]$"
        home:
          type: "string"
        remembered:
          type: "string"
        written:
          type: "string"
        spoken:
          type: "string"
        number:
          type: "integer"
        check:
          type: "integer"
        status:
          type: "string"
          enum:
            - "provisional"
            - "confirmed"
            - "retired"
        issued:
          type: "string"
          enum:
            - "bulk"
            - "on-demand"
        issuedAt:
          type: "string"
          format: "date-time"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum:
                - "centre"
                - "gate"
                - "door"
        spot:
          type: "object"
          properties:
            plusCode:
              type: "string"
            short:
              type: "string"
        officialAddress:
          type:
            - "string"
            - "null"
        profile:
          type: "object"
          properties:
            class:
              type:
                - "string"
                - "null"
            use:
              type: "string"
            kind:
              type: "string"
            structures:
              type: "integer"
            floorAreaM2:
              type: "number"
            rule:
              type:
                - "string"
                - "null"
            estate:
              type:
                - "string"
                - "null"
        area:
          "$ref": "#/components/schemas/AreaBrief"
        zone:
          "$ref": "#/components/schemas/Zone"
        registry:
          "$ref": "#/components/schemas/RegistryRow"
        credit:
          type: "string"
        creditUrl:
          type: "string"
        distanceM:
          type: "number"
          description: "on lookups by point"
      required:
        - "machine"
        - "home"
        - "remembered"
        - "written"
        - "number"
        - "status"
        - "registry"
    Found:
      type: "object"
      properties:
        form:
          type: "string"
          enum:
            - "remembered"
            - "written"
            - "machine"
            - "official"
            - "spot"
        count:
          type: "integer"
        results:
          type: "array"
          items:
            "$ref": "#/components/schemas/Card"
        typedOfficialName:
          type: "boolean"
      required:
        - "form"
        - "count"
        - "results"
    At:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "found"
            - "none"
        distanceM:
          type: "number"
        code:
          "$ref": "#/components/schemas/Card"
        canIssue:
          type: "boolean"
        area:
