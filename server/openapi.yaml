              examples: {}
        "404":
          description: "unknown area, or a valid code no compound holds"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                code_notissued:
                  value:
                    error:
                      code: "not_issued"
                      message: "CI-010114-083-8399-5 is a valid code, but no compound has it yet."
